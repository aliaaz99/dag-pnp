data:
  data: dag_pnp_ER4_d20
  dir: './data'
  directed: true
  batch_size: 128
  test_split: 0.2
  max_node_num: 20
  max_feat_num: 10
  init: ones

sde:
  x:
    type: VP
    beta_min: 0.1
    beta_max: 1.0
    num_scales: 1000
  adj:
    type: VP
    beta_min: 0.1
    beta_max: 1.0
    num_scales: 1000

model:
  x: ScoreNetworkX_Transformer
  adj: ScoreNetworkA_Transformer
  # Transformer architecture (DIRECTO dual-attention backbone)
  n_layers: 5        # number of transformer blocks
  dx: 128            # node hidden dim  (must be divisible by n_head)
  de: 64             # edge hidden dim
  dy: 64             # global / time-embedding dim
  n_head: 4          # attention heads
  dim_ffX: 256       # node feed-forward dim
  dim_ffE: 128       # edge feed-forward dim
  dropout: 0.0       # 0 works well for score matching

train:
  name: dag_pnp_er4_d20_transformer
  num_epochs: 5000
  save_interval: 1000
  print_interval: 500
  reduce_mean: False
  lr: 0.0001          # lower LR than GCN baseline — transformer is more sensitive
  lr_schedule: True
  ema: 0.999
  weight_decay: 0.0001
  grad_norm: 1.0
  lr_decay: 0.9999    # much gentler decay: ~60% of lr_0 at epoch 5000
  eps: 1.0e-5

sampler:
  predictor: Euler
  corrector: Langevin
  snr: 0.05
  scale_eps: 0.7
  n_steps: 1

sample:
  use_ema: False
  noise_removal: True
  probability_flow: False
  eps: 1.0e-4
  seed: 42
