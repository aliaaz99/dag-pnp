data:
  data: sem_SF_d20_low_weights
  dir: './data'
  directed: true
  batch_size: 128
  test_split: 0.2
  max_node_num: 20
  max_feat_num: 10
  init: ones

sde:
  x:
    type: VP
    beta_min: 0.1
    beta_max: 1.0
    num_scales: 1000
  adj:
    type: VP
    beta_min: 0.1
    beta_max: 1.0
    num_scales: 1000

model:
  x: ScoreNetworkX
  adj: ScoreNetworkA
  conv: GCN           # DenseGCNConv now uses D_out^{-1/2} A D_in^{-1/2} for directed graphs
  num_heads: 4
  depth: 3
  adim: 64            # increased from 32 — directed adj has 2x the free parameters vs undirected
  nhid: 64            # increased from 32
  num_layers: 5
  num_linears: 2
  c_init: 2
  c_hid: 8
  c_final: 4

train:
  name: sem_sf_d20
  num_epochs: 5000
  save_interval: 1000
  print_interval: 500
  reduce_mean: False
  lr: 0.001       
  lr_schedule: True
  ema: 0.999
  weight_decay: 0.0001
  grad_norm: 1.0
  lr_decay: 0.999
  eps: 1.0e-5

sampler:
  predictor: Euler
  corrector: Langevin
  snr: 0.05
  scale_eps: 0.7
  n_steps: 1

sample:
  use_ema: False
  noise_removal: True
  probability_flow: False
  eps: 1.0e-4
  seed: 42
